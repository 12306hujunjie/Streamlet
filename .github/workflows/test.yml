name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
      id-token: write

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install PDM
      run: |
        python -m pip install --upgrade pip
        pip install pdm

    - name: Cache PDM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pdm
          .venv
        key: ${{ runner.os }}-pdm-${{ matrix.python-version }}-${{ hashFiles('pdm.lock') }}
        restore-keys: |
          ${{ runner.os }}-pdm-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        pdm install -G dev

    - name: Run quality gates
      run: |
        pdm run ruff check src/ tests/
        pdm run ruff format --check src/ tests/
        pdm run mypy src/streamlet/
        pdm run bandit -r src/

    - name: Run tests with pytest
      run: |
        mkdir -p reports
        pdm run pytest tests/ \
          --verbose \
          --cov=src/streamlet \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --html=reports/pytest_report.html \
          --self-contained-html \
          --junitxml=reports/junit.xml

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-python-${{ matrix.python-version }}
        path: |
          reports/
          htmlcov/
          coverage.xml
        retention-days: 30

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.10'
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        use_oidc: true
        fail_ci_if_error: false

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: reports/junit.xml
        check_name: "Unit Test Results (Python ${{ matrix.python-version }})"
        comment_mode: always

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Check test results
      run: |
        if [[ "${{ needs.test.result }}" == "success" ]]; then
          echo "✅ All tests passed successfully!"
        else
          echo "❌ Some tests failed!"
          exit 1
        fi

    - name: Report status
      run: |
        echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Matrix | Python Versions | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | 3.10, 3.11, 3.12, 3.13, 3.14 | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 Test reports and coverage data are available in the artifacts." >> $GITHUB_STEP_SUMMARY
