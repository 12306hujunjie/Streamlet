name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
      id-token: write

  publish:
    runs-on: ubuntu-latest
    environment: release
    needs: test
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PDM
        run: pip install pdm

      - name: Install dependencies
        run: pdm install -G dev

      - name: Build package
        run: pdm build

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        run: pdm publish --repository testpypi --username __token__ --password ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
        run: pdm publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload artifacts to Release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
