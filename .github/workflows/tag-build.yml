name: Tag Build and Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDM
        run: |
          curl -sSL https://pdm-project.org/install-pdm.py | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pdm install -G dev

      - name: Validate tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(pdm run python - <<'PY'
          from pathlib import Path

          in_project = False
          for line in Path("pyproject.toml").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if stripped == "[project]":
                  in_project = True
                  continue
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_project = False
              if in_project and stripped.startswith("version = "):
                  print(stripped.split("=", 1)[1].strip().strip('"'))
                  break
          else:
              raise SystemExit("project.version not found in pyproject.toml")
          PY
          )"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ${TAG_VERSION} does not match pyproject.toml version ${PROJECT_VERSION}."
            exit 1
          fi

      - name: Run quality gates
        run: |
          pdm run ruff check src/ tests/
          pdm run ruff format --check src/ tests/
          pdm run mypy src/streamlet/
          pdm run bandit -r src/

      - name: Run tests
        run: |
          pdm run pytest

      - name: Build package
        run: |
          pdm build

      - name: Publish package to PyPI
        run: |
          pdm publish --username __token__ --password "${{ secrets.PYPI_API_TOKEN }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 30
