name: Continuous Integration

# 在推送和拉取请求时触发
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    # 检出代码
    - uses: actions/checkout@v4

    # 设置Python环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 安装PDM
    - name: Install PDM
      run: pip install pdm

    - name: Install dependencies
      run: pdm install --dev

    - name: Run tests with coverage
      run: pdm run pytest tests/ --verbose --cov=aetherflow --cov-report=term-missing

    - name: Check code quality
      run: pdm run ruff check src/ tests/
      continue-on-error: true
